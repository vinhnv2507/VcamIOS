name: Build vcam

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-v3

      - name: Install Theos + SDK + Toolchain
        run: |
          if [ ! -d "$THEOS" ]; then
            sudo apt-get update
            sudo apt-get install -y fakeroot perl rsync unzip curl git xz-utils libtinfo6
            git clone --recursive https://github.com/theos/theos.git $THEOS
            curl -LO https://github.com/theos/sdks/archive/refs/heads/master.zip
            unzip -q master.zip
            mkdir -p $THEOS/sdks
            mv sdks-master/* $THEOS/sdks/
            rm -rf sdks-master master.zip
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C $THEOS/toolchain/
          fi

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb

name: Build tweak

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build Debian package
        run: make package FINALPACKAGE=1

      - name: Validate Debian package
        run: |
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = "com.yourcompany.vcam"
          test "$(dpkg-deb --field "$deb" Architecture)" = "iphoneos-arm"
          dpkg-deb --contents "$deb" | grep -q 'Library/MobileSubstrate/DynamicLibraries/vcam.dylib'
          dpkg-deb --contents "$deb" | grep -q 'Library/MobileSubstrate/DynamicLibraries/VCamOverlay.dylib'
          dpkg-deb --contents "$deb" | grep -q 'Applications/VCam.app/VCam'
          dpkg-deb --contents "$deb" | grep -q 'Applications/VCam.app/Info.plist'
          if dpkg-deb --contents "$deb" | grep -q 'var/jb'; then
            echo "Rootless path found in rootful package" >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish raw DEB in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view neko-rootful >/dev/null 2>&1; then
            gh release upload neko-rootful packages/*.deb --clobber
          else
            gh release create neko-rootful packages/*.deb \
              --title "VCam – NekoJB rootful" \
              --notes "Rootful package for iOS 15 and NekoJB, with a home-screen media picker. Built and validated with dpkg-deb."
          fi

      - name: Create flat APT repository
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev
          mkdir -p apt-repo
          cp packages/*.deb apt-repo/
          repo_deb="$(find apt-repo -maxdepth 1 -name '*.deb' -print -quit)"
          repo_version="$(dpkg-deb --field "$repo_deb" Version)"
          cd apt-repo
          apt-ftparchive packages . > Packages
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          xz -9c Packages > Packages.xz
          cd ..
          release_checksums="$(mktemp)"
          (cd apt-repo && apt-ftparchive release .) > "$release_checksums"
          {
            echo "Origin: VCam"
            echo "Label: VCam for NekoJB"
            echo "Suite: stable"
            echo "Version: $repo_version"
            echo "Codename: neko-rootful"
            echo "Architectures: iphoneos-arm"
            echo "Components: main"
            echo "Description: VCam rootful repository"
            cat "$release_checksums"
          } > apt-repo/Release
          rm -f "$release_checksums"

      - name: Publish APT repository branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./apt-repo
          force_orphan: true

name: Build tweak

permissions:
  contents: write

on:
  workflow_dispatch:
  push:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build Debian package
        run: make package FINALPACKAGE=1

      - name: Validate Debian package
        run: |
          deb="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = "com.yourcompany.vcam"
          test "$(dpkg-deb --field "$deb" Architecture)" = "iphoneos-arm64"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish raw DEB in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sileo-compatible >/dev/null 2>&1; then
            gh release upload sileo-compatible packages/*.deb --clobber
          else
            gh release create sileo-compatible packages/*.deb \
              --title "VCam – Sileo-compatible build" \
              --notes "Rootless package built and validated with dpkg-deb. Download the .deb file directly."
          fi

name: Build tweak

permissions:
  contents: write

on:
  workflow_dispatch:
  push:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        uses: Randomblock1/theos-action@v1

      - name: Build Debian package
        run: make package FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish raw DEB in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build packages/*.deb --clobber
          else
            gh release create latest-build packages/*.deb \
              --title "Latest VCam build" \
              --notes "Automatic rootless build. Download the .deb file directly; do not install the artifact ZIP."
          fi
